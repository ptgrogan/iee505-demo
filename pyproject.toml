[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "iee505"
version = "0.0.0"
dependencies = [
  "fastapi[standard]",
  "sqlmodel",
  "pyjwt",
  "pwdlib[argon2]"
]
requires-python = ">=3.8"
authors = [
  {name = "Paul Grogan", email = "paul.grogan@asu.edu"},
]
description = "Example package for IEE 505!"
readme = "README.md"

[project.urls]
Homepage = "https://github.com/ptgrogan/iee505-demo"

[project.optional-dependencies]
docs = [
  "autodoc_pydantic >= 2",
  "sphinx >= 7",
]

[tool.pytest.ini_options]
pythonpath = [ "src" ]